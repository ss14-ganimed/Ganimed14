## Role Loadouts

- type: roleLoadout
  id: JobChiefMedicalOfficer
  groups:
  - Inventory # Corvax-Loadouts
  - GroupTankHarness
  - ChiefMedicalOfficerHead
  - ChiefMedicalOfficerMedicalMask # Ganimed-Loadouts-Edit (MedicalMask)
  - ChiefMedicalOfficerJumpsuit
  - MedicalGloves
  - ChiefMedicalOfficerBackpack # Ganimed-Loadouts-Edit (MedicalBackpack)
  - ChiefMedicalOfficerBelt # Ganimed-Loadouts-Edit (ADTMedicalBelt)
  - ChiefMedicalOfficerOuterClothing
  - ChiefMedicalOfficerNeck
  - ADTChiefMedicalOfficerEars # ADT tweak
  - ChiefMedicalOfficerShoes
  - ChiefMedicalOfficerGlasses # Ganimed-Loadouts-Edit (MedicalEyewear)
  - ADTCMOPDA # ADT tweak
  # ADT underwear tweak start
  - ADTTopCMO
  - ADTBottomCMO
  - ADTSocks
  # ADT underwear tweak end
  - SurvivalMedical
  - NonLethalWeaponsCommand # Ganimed-Loadouts-Add
  - Trinkets
  - GroupSpeciesBreathToolMedical
  - SpareClothing # Ganimed-Loadouts-Add

