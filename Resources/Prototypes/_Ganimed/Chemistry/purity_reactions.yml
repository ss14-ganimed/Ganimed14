# Equilibrium (competing / reverse) reactions and additional purity-tuned recipes.

- type: reagent
  id: Tempomyocin
  name: reagent-name-tempomyocin
  group: Special
  desc: reagent-desc-tempomyocin
  physicalDesc: reagent-physical-desc-sharp-smelling
  color: "#6AD7E5"
  pH: 7
  unreactedPurity: 0.75
  inverseThreshold: 0.25

- type: reaction
  id: TempomyocinCold
  reactants:
    Water:
      amount: 1
    Carbon:
      amount: 1
  products:
    Tempomyocin: 2
  minTemp: 0
  maxTemp: 320
  clearImpureAtEnd: true
  competingReaction: TempomyocinHot
  competingFavor: Cold
  competingThreshold: 320

- type: reaction
  id: TempomyocinHot
  source: true
  reactants:
    Tempomyocin:
      amount: 2
  products:
    Water: 1
    Carbon: 1
  minTemp: 280
  maxTemp: 1000
  competingReaction: TempomyocinCold
  competingFavor: Hot
  competingThreshold: 320
