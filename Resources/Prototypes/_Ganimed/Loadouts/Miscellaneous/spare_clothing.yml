# Spare clothes. All loadout IDs should start with "Spare" to avoid conflict with regular loadouts
# Timers
- type: loadoutEffectGroup
  id: FiftyOverall
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:OverallPlaytimeRequirement
      time: 180000 # 50 hours

