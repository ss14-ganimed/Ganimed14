# Кровавые брызги и следы волочения (decals).
# Используются системой BloodDecalSystem и для следов истекающих тел.
# Тег ganimed-blood: швабра впитывает кровь с таких декалей (DecalMoppingSystem).
- type: decal
  id: BloodSplatter0
  tags: ["ganimed-blood"]
  defaultCleanable: true
  defaultCustomColor: true
  defaultSnap: false
  sprite:
    sprite: Fluids/splatter.rsi
    state: splatter-0

