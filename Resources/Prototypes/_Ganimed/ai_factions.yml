# Soldiers are friendly only to each other: they shoot every player and every hostile creature on sight.
# Pets and other harmless animals (Passive, Mouse, PetsNT, SimpleNeutral) are left alone.
# The other factions treat the soldiers as hostile too (the "Soldier" lines in their hostile lists).
- type: npcFaction
  id: Soldier
  hostile:
  - NanoTrasen
  - Syndicate
  - Revolutionary
  - Wizard
  - Heretic
  - Conspirator
  - Pirate
  - SpaceSecFaction
  - Xeno
  - Zombie
  - SimpleHostile
  - Dragon
  - Xenoborg
  - DroneAntag
  - ADTSpaceMobs
  - Ursus

# Explicit AI profiles. Covert antagonist status is not a hostile faction in these profiles.
- type: npcFaction
  id: GanimedSoldierNT
  friendly: [NanoTrasen, GanimedSoldierERT]
  hostile: [Syndicate, GanimedSoldierSyndicate, GanimedSoldierNuclear, SimpleHostile, Xeno, Zombie]

- type: npcFaction
  id: GanimedSoldierERT
  friendly: [NanoTrasen, GanimedSoldierNT]
  hostile: [Syndicate, GanimedSoldierSyndicate, GanimedSoldierNuclear, SimpleHostile, Xeno, Zombie]

- type: npcFaction
  id: GanimedSoldierSyndicate
  friendly: [Syndicate, GanimedSoldierNuclear]
  hostile: [NanoTrasen, GanimedSoldierNT, GanimedSoldierERT, SimpleHostile, Xeno, Zombie]

- type: npcFaction
  id: GanimedSoldierNuclear
  friendly: [Syndicate, GanimedSoldierSyndicate]
  hostile: [NanoTrasen, GanimedSoldierNT, GanimedSoldierERT, SimpleHostile, Xeno, Zombie]
