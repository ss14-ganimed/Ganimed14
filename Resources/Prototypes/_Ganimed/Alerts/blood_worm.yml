- type: alert
  id: BloodWormBlood
  icons:
  - sprite: /Textures/_Ganimed/Interface/Alerts/blood_counter.rsi
    state: blood0
  alertViewEntity: AlertBloodWormBloodSpriteView
  name: alerts-blood-worm-blood-name
  description: alerts-blood-worm-blood-desc

- type: entity
  id: AlertBloodWormBloodSpriteView
  categories: [ HideSpawnMenu ]
  components:
  - type: GenericCounterAlert
    centerGlyph: false
    hideLeadingZeroes: false
  - type: Sprite
    sprite: /Textures/_Ganimed/Interface/Alerts/blood_counter.rsi
    layers:
    - map: [ "enum.AlertVisualLayers.Base" ]
    - map: [ "1" ]
      offset: 0.125, 0
    - map: [ "10" ]
      offset: 0, 0
    - map: [ "100" ]
      offset: -0.125, 0
