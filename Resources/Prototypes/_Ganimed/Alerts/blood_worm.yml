  - sprite: /Textures/ADT/Interface/Alerts/human_alive.rsi
    state: health1
  - sprite: /Textures/ADT/Interface/Alerts/human_alive.rsi
    state: health2
  - sprite: /Textures/ADT/Interface/Alerts/human_alive.rsi
    state: health3
  - sprite: /Textures/ADT/Interface/Alerts/human_alive.rsi
    state: health4
  - sprite: /Textures/ADT/Interface/Alerts/human_alive.rsi
