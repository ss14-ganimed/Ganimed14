# Field units and expeditionary operators use faction equipment, not the legacy test loadout.
# Role children inherit the primary weapon; storage lists replace the corresponding bag contents.
# Uplinks are issued once by SoldierLogisticsSystem, not duplicated in starting gear.

- type: startingGear
  id: GanimedSoldierNTGear
