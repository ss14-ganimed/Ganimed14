# Gear of the soldier NPC: a rifle in the hands, spare magazines, grenades, first aid and a headset.
# The soldier AI takes the rifle from the hands, reloads from the spare magazines, throws the grenades
# and heals itself with the medical items, wherever they are stored.
- type: startingGear
  id: GanimedSoldierGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitMercenary
    outerClothing: ClothingOuterArmorBulletproof
    head: ClothingHeadHelmetSwat
    gloves: ClothingHandsGlovesCombat
    shoes: ClothingShoesBootsMerc
    ears: ClothingHeadsetSoldier
    belt: ClothingBeltMilitaryWebbing
    back: ClothingBackpack
    pocket1: WeaponPistolMk58
    pocket2: MagazinePistol
  inhand:
  - WeaponRifleLecter
  storage:
    belt:
    - MagazineRifle
    - MagazineRifle
    - MagazineRifle
    - MagazineRifle
    back:
    - GrenadeFlashBang
    - GrenadeFlashBang
    - GrenadeShrapnel
    - Brutepack
    - Ointment
    - Gauze

# Gear of the squad medic: the same armor and the same rifle as the soldiers have, but the backpack holds combat medical
# kits (bandages, sutures and auto-injectors), a body scanner and a defibrillator instead of the grenades. The one-handed
# defibrillator is always powered: the soldier has no one to change its battery. The medic AI takes everything it needs out
# of the backpack, wherever it is stored (see SoldierMedicSystem).
- type: startingGear
  id: GanimedSoldierMedicGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitMercenary
    outerClothing: ClothingOuterArmorBulletproof
    head: ClothingHeadHelmetSwat
    gloves: ClothingHandsGlovesCombat
    shoes: ClothingShoesBootsMerc
    ears: ClothingHeadsetSoldier
    belt: ClothingBeltMilitaryWebbingMed
    back: ClothingBackpack
    pocket1: WeaponPistolMk58
    pocket2: MagazinePistol
  inhand:
  - WeaponRifleLecter
  storage:
    belt:
    - MagazineRifle
    - MagazineRifle
    - MagazineRifle
    back:
    - MedkitCombatFilled
    - MedkitCombatFilled
    - MedkitCombatFilled
    - HandheldHealthAnalyzer
    - DefibrillatorOneHandedUnpowered

# Gear of the headquarters: the armor and the headset of the soldiers (the headset is the whole point: the headquarters lives
# on the radio), a command beret and a pistol. The headquarters keeps behind the others and only defends itself, so there is
# no rifle. The backpack holds the spare magazines and a few bandages.
- type: startingGear
  id: GanimedSoldierHQGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitMercenary
    outerClothing: ClothingOuterArmorBulletproof
    head: ClothingHeadHatBeretCommand
    gloves: ClothingHandsGlovesCombat
    shoes: ClothingShoesBootsMerc
    ears: ClothingHeadsetSoldier
    belt: ClothingBeltMilitaryWebbing
    back: ClothingBackpack
    pocket1: MagazinePistol
    pocket2: MagazinePistol
  inhand:
  - WeaponPistolMk58
  storage:
    back:
    - MagazinePistol
    - MagazinePistol
    - MagazinePistol
    - GrenadeFlashBang
    - Brutepack
    - Ointment
    - Gauze
