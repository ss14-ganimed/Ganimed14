- type: entity
  parent: BaseGameRule
  id: StraySupplyPod
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    startAnnouncement: station-event-stray-supply-pod-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    weight: 2
    duration: 1
    minimumPlayers: 5
    earliestStart: 10
    reoccurrenceDelay: 15
  - type: RandomSpawnRule
    prototype: SpawnStraySupplyPod

- type: entity
  parent: BaseGameRule
  id: StraySupplyPodSyndicate
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    startAnnouncement: station-event-stray-supply-pod-syndicate-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    weight: 1
    duration: 1
    minimumPlayers: 10
    maxOccurrences: 2
    earliestStart: 15
    reoccurrenceDelay: 60
    departmentPlayerLimits:
      Security: 1
  - type: RandomSpawnRule
    prototype: SpawnStraySupplyPodSyndicate
