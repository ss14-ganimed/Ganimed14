# The radio of the soldier NPCs. It carries the common key only (";") and works without a telecommunications server,
# so the soldiers can talk on any map, e.g. on a base that has no telecoms at all.
- type: entity
  parent: ClothingHeadset
  id: ClothingHeadsetSoldier
  components:
  - type: TelecomExempt
  - type: Sprite
    sprite: ADT/Clothing/Ears/Headsets/armyheadset.rsi
  - type: Clothing
    sprite: ADT/Clothing/Ears/Headsets/armyheadset.rsi
