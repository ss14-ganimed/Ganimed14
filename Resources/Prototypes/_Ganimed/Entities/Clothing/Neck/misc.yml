# Security badges
- type: entity
  parent: ADTClothingNeckSecBadgeBronze
  id: ClothingNeckSecBadgeOfficerBronze
  name: bronze security officer badge
  components:
  - type: Sprite
    sprite: _Ganimed/Clothing/Neck/Misc/sec_badge.rsi
    layers:
    - state: officer-icon
    - state: bronze-icon
  - type: Clothing
    sprite: _Ganimed/Clothing/Neck/Misc/sec_badge.rsi
    clothingVisuals:
      neck:
      - state: officer-equipped-NECK
      - state: bronze-equipped-NECK
  - type: Item
    inhandVisuals:
      left:
      - state: bronze-inhand-left
      right:
      - state: bronze-inhand-right

