- type: entity 
  abstract: true
  id: ClothingBackpackSatchelFoldableBase
  components:
  - type: Foldable 
    canFoldInsideContainer: true
    unfoldVerbText: holster-unfold-verb-text
    foldVerbText: holster-fold-verb-text
  - type: FoldableClothing
    foldedEquippedPrefix: mirrored # don't forget to add the mirrored sprite in rsi for ALL new satchels

- type: entity
  id: ClothingBackpackSatchelCaptainWhite
  parent: [ClothingBackpackSatchel, BaseCommandContraband, ClothingBackpackSatchelFoldableBase]
  name: white captain's satchel
  description: Is it your imagination, or is there a stain on it?
  components:
  - type: Sprite
    sprite: _Ganimed/Clothing/Back/Satchels/captain_white.rsi

- type: entity
  parent: [ClothingBackpackSatchel, BaseCommandContraband]
  id: ClothingBackpackSatchelHop
  name: head of personnel's satchel
  description: An exclusive satchel for bureaucracy related needs.
  components:
  - type: Sprite
    sprite: _Ganimed/Clothing/Back/Satchels/hop.rsi

- type: entity
  parent: ClothingBackpackSatchel
  id: ClothingBackpackSatchelChiefMedicalOfficer
  name: chief medical officer's satchel
  description: A sterile satchel with barely enough pockets to carry the chief medical officer's equipment.
  components:
  - type: Sprite
    sprite: _Ganimed/Clothing/Back/Satchels/cmo.rsi

- type: entity
  parent: ClothingBackpackSatchel
  id: ClothingBackpackSatchelCargoDark
  name: dark cargo satchel
  description: A robust satchel for stealing cargo's loot.
  components:
  - type: Sprite
    sprite: _Ganimed/Clothing/Back/Satchels/cargo_dark.rsi

- type: entity
  parent: ClothingBackpackSatchel
  id: ClothingBackpackSatchelRobotics
  name: robotics satchel
