- type: entity
  id: ChemistryBottleBasicBuffer
  suffix: basic buffer
  parent: BaseChemistryBottleFilled
  components:
  - type: Label
    currentLabel: reagent-name-basic-buffer
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: BasicBuffer
          Quantity: 30

- type: entity
