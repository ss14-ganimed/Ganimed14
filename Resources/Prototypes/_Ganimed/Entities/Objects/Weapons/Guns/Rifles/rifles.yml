- type: entity
  parent: [BaseWeaponRifle, ADTBaseMagneticGun]
  id: WeaponRifleABZ
  name: ABZ-84
  description: Bobrovskyi-Zamyatin assault rifle model 2584. State-of-the-art rifle designed in USSP, "balanced" operating system and increased rate of fire. Uses .30 rifle ammo.
  components:
  - type: Sprite
    sprite: _Ganimed/Objects/Weapons/Guns/Rifles/abz.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Ganimed/Objects/Weapons/Guns/Rifles/abz.rsi
  - type: Gun
    fireRate: 6
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rifle2.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineLightRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeLightRifle
        priority: 1
        whitelist:
          tags:
          - CartridgeLightRifle
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: AttachableHolder
    slots:
      rmc-aslot-underbarrel:
        startingAttachable: ADTAttachmentVerticalGrip
        whitelist:
          tags:
          - ADTAttachmentM90GrenadeLauncher
          - ADTAttachmentM90UnderbarrelShotgun
          - ADTAttachmentVerticalGrip
          - ADTAttachmentLaserSight
          - SurvivalKnifeAttachment
      rmc-aslot-rail:
        startingAttachable: ADTAttachmentT2Miniscope
        whitelist:
          tags:
          - ADTAttachmentMagneticHarness
          - ADTAttachmentReflexSight
          - ADTAttachmentT2Miniscope
      rmc-aslot-barrel:
        whitelist:
          tags:
          - ADTAttachmentSuppressor
          - ADTAttachmentAntiLyingWarrior
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-underbarrel: 0.3125, 0.0
      rmc-aslot-rail: -0.0940, -0.0325
      rmc-aslot-barrel: 0.96875, 0.055
