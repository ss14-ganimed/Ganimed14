- type: entity
  id: MobBloodWormHatchling
  parent: SimpleMobBase
  name: blood worm hatchling
  description: A freshly hatched blood worm that desperately seeks blood and a host.
  components:
  - type: Body
    prototype: Mouse
  - type: Sprite
    drawdepth: SmallMobs
    sprite: _Ganimed/Mobs/Aliens/Blood_Worms/blood_worm_hatchling.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: base
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: base
      Dead:
        Base: dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.5
    baseSprintSpeed: 4.5
  - type: Bloodstream
    bloodMaxVolume: 250
  - type: BloodWormResource
  - type: LanguageSpeaker
    languages:
      GalacticCommon: Understand
      BloodWorm: Speak
  - type: NightVision
  - type: VentCrawler
  - type: CombatMode
  - type: MeleeWeapon
    angle: 30
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 12
  - type: Damageable
    damageContainer: Biological
  - type: NpcFactionMember
    factions:
    - BloodWorm
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: BloodWorm
    stage: Hatchling
    maxBloodResource: 80
    bloodResource: 80
    enterHostSound: /Audio/Weapons/Xeno/alien_claw_flesh1.ogg
    leaveHostSound: /Audio/Effects/gib2.ogg
    spitSound: /Audio/Weapons/Xeno/alien_spitacid.ogg
    cocoonFormSound: /Audio/Effects/Changeling/devour_windup.ogg
    cocoonHatchSound: /Audio/Effects/gib1.ogg
    leechTickSound: /Audio/Effects/Fluids/blood1.ogg
    spitProjectile: BulletBloodWormSpit
    regenPerSecond: 0.3
    hostDrainPerSecond: 12
    hostBleedDamageMultiplier: 4
    leechAction: ActionBloodWormLeechHatchling
    invadeAction: ActionBloodWormInvade
    matureAction: ActionBloodWormMature
    injectAction: ActionBloodWormInject
    leaveHostAction: ActionBloodWormLeaveHost
    reviveHostAction: ActionBloodWormReviveHost

- type: entity
  id: MobBloodWormCocoonJuvenile
  parent: MobBloodWormHatchling
  name: blood worm cocoon
  description: A pulsing cocoon. Something inside is about to hatch.
  components:
  - type: MovementSpeedModifier
    baseWalkSpeed: 0
    baseSprintSpeed: 0
  - type: BloodWorm
    stage: Cocoon
    maxBloodResource: 120
    bloodResource: 120
    regenPerSecond: 0
    hostDrainPerSecond: 0
    leechAction: null
    invadeAction: null
    spitAction: null
    matureAction: null
    injectAction: null
    leaveHostAction: null
    reviveHostAction: null
    cocoonHatchPrototype: MobBloodWormJuvenile
    cocoonHatchDelay: 30
  - type: Sprite
    drawdepth: Mobs
    sprite: _Ganimed/Mobs/Aliens/Blood_Worms/blood_worm_cocoon.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: small

- type: entity
  id: MobBloodWormCocoonAdult
  parent: MobBloodWormCocoonJuvenile
  name: blood worm cocoon
  description: A dense cocoon close to bursting.
  components:
  - type: BloodWorm
    maxBloodResource: 180
    bloodResource: 180
    cocoonHatchPrototype: MobBloodWormAdult
    cocoonHatchDelay: 30
  - type: Sprite
    drawdepth: Mobs
    sprite: _Ganimed/Mobs/Aliens/Blood_Worms/blood_worm_cocoon.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: medium

- type: entity
  id: MobBloodWormCocoonReproduction
  parent: MobBloodWormCocoonJuvenile
  name: blood worm brood cocoon
  description: This cocoon writhes with multiple larvae.
  components:
  - type: BloodWorm
    maxBloodResource: 100
    bloodResource: 100
    cocoonHatchPrototype: MobBloodWormHatchling
    cocoonHatchDelay: 30
    cocoonSpawnHatchlings: 3
    cocoonResetProgress: true
  - type: Sprite
    drawdepth: Mobs
    sprite: _Ganimed/Mobs/Aliens/Blood_Worms/blood_worm_cocoon.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: reproduce

