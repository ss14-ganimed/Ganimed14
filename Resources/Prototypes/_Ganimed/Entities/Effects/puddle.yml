- type: entity
  name: след
  id: Footstep
  save: false
  description: След жидкости.
  components:
  - type: Clickable
  - type: Transform
    noRot: false
  - type: Sprite
    drawdepth: FloorObjects
  - type: SolutionContainerManager
    solutions:
      step: { maxVol: 2.5 }
  - type: Footprint
    printType: Foot
  - type: Puddle
    solution: step
    canSlow: false
  - type: Appearance
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      footstepFixture:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        mask:
        - ItemMask
        layer:
        - SlipLayer
        hard: false

- type: entity
  name: полоса волочения
  parent: Footstep
  id: DragMark
  components:
  - type: Footprint
    printType: DragMark
  - type: SolutionContainerManager
    solutions:
      step: { maxVol: 5 }
