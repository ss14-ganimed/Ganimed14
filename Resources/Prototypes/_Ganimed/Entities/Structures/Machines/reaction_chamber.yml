- type: entity
  id: MachineReactionChamber
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: reaction chamber
  description: A programmable chemical reactor with an inert buffer and beaker slot. Reagents in the buffer do not react.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Ganimed/Structures/Machines/reaction_chamber.rsi
    snapCardinals: true
    layers:
    - state: chamber_empty
  - type: Icon
    sprite: _Ganimed/Structures/Machines/reaction_chamber.rsi
    state: chamber_empty
  - type: ItemMapper
    containerWhitelist: [beakerSlot]
    mapLayers:
      chamber_loaded:
        whitelist:
          components:
          - FitsInDispenser
  - type: ReactionChamber
    heatPerSecond: 160
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.4,0.25,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ActivatableUI
    key: enum.ReactionChamberUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.ReactionChamberUiKey.Key:
        type: ReactionChamberBoundUserInterface
  - type: ApcPowerReceiver
    powerLoad: 300
  - type: Appearance
  - type: WiresPanel
  - type: Machine
    board: ReactionChamberMachineCircuitboard
  - type: ContainerContainer
    containers:
      beakerSlot: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: ItemSlots
    slots:
      beakerSlot:
        whitelist:
          components:
          - FitsInDispenser
  - type: SolutionContainerManager
    solutions:
      buffer:
        maxVol: 300
        canReact: false
  - type: GuideHelp
    guides:
    - Chemicals
    - Chemist
