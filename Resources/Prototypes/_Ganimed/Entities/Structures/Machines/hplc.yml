- type: entity
  id: MachineHplc
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: high-performance liquid chromatography machine
  description: Separates and partially purifies reagents by chromatography. Requires input and output beakers. Cannot raise purity above 70%.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Ganimed/Structures/Machines/hplc.rsi
    snapCardinals: true
    layers:
    - state: hplc_base
    - state: hplc_screens
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      shader: unshaded
  - type: Icon
    sprite: _Ganimed/Structures/Machines/hplc.rsi
    state: hplc_base
  - type: Hplc
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: ActivatableUI
    key: enum.HplcUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.HplcUiKey.Key:
        type: HplcBoundUserInterface
  - type: ApcPowerReceiver
    powerLoad: 300
  - type: WiresPanel
  - type: Machine
    board: HplcMachineCircuitboard
  - type: ContainerContainer
    containers:
      beakerSlot: !type:ContainerSlot
      outputBeakerSlot: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: ItemSlots
    slots:
      beakerSlot:
        whitelist:
          components:
          - FitsInDispenser
      outputBeakerSlot:
        name: hplc-output-slot
        whitelist:
          components:
          - FitsInDispenser
  - type: GuideHelp
    guides:
    - Chemicals
    - Chemist
