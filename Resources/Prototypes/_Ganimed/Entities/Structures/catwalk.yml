# TODO move this to tiles once tile smoothing is supported
- type: entity
  id: FloorCatwalkHardSteel
  name: hard steel catwalk
  description: A catwalk for easier EVA maneuvering and cable placement.
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: Sprite
    sprite: _Ganimed/Structures/single_catwalk.rsi
    state: hard_steel
    drawdepth: FloorTiles
  - type: Icon
    sprite: _Ganimed/Structures/single_catwalk.rsi
    state: hard_steel
  - type: Transform
    anchored: true
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepCatwalk
      params:
        volume: 8
  - type: Tag
    tags:
    - Catwalk
#  - type: Construction
#    graph: Catwalk
#    node: Catwalk
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 350
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal:
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: TrayScanReveal
  - type: RCDDeconstructable
    cost: 2
    delay: 2
    fx: EffectRCDDeconstruct2

- type: entity
  parent: FloorCatwalkHardSteel
  id: FloorCatwalkHardSteelWhite
  name: hard white steel catwalk
  components:
  - type: Sprite
    state: hard_white_steel
  - type: Icon
    state: hard_white_steel

- type: entity
  parent: FloorCatwalkHardSteel
  id: FloorCatwalkHardSteelDark
  name: hard dark steel catwalk
  components:
  - type: Sprite
    state: hard_dark_steel
  - type: Icon
    state: hard_dark_steel

- type: entity
  parent: FloorCatwalkHardSteel
  id: FloorCatwalkHardSteelSmooth
  name: hard smooth steel catwalk
  components:
  - type: Sprite
    state: hard_smooth_steel
  - type: Icon
    state: hard_smooth_steel

- type: entity
  parent: FloorCatwalkHardSteel
  id: FloorCatwalkHardMaint
  name: hard maintenance catwalk
  components:
  - type: Sprite
    state: hard_maint
  - type: Icon
    state: hard_maint

- type: entity
  parent: FloorCatwalkHardSteel
  id: FloorCatwalkHardTitanium
  name: hard titanium catwalk
  components:
  - type: Sprite
    state: hard_titanium
  - type: Icon
    state: hard_titanium
