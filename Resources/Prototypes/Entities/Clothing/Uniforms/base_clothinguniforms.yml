- type: entity
  abstract: true
  parent: Clothing
  id: UnsensoredClothingUniformBase
  components:
  - type: Sprite
    state: icon
  - type: Clothing
    slots: [innerclothing]
    equipSound:
      path: /Audio/Items/jumpsuit_equip.ogg
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: MaterialCloth1
      amount: 3
  - type: PhysicalComposition # 50% of the amount of cloth you'd obtain upon butchering
    materialComposition:
      Cloth: 150
  - type: Edible
    requiresSpecialDigestion: true
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Fiber
          Quantity: 30
      stain: # Ganimed-Port: стайны (funky-station/forky-station#107)
        maxVol: 5
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon
  # Ganimed-Port-Start: стайны (funky-station/forky-station#107)
  - type: Appearance
  - type: Stainable
    clothingVisuals:
      jumpsuit:
      - sprite: _Ganimed/Effects/blood.rsi
        state: uniformblood
    iconVisuals:
    - sprite: _Ganimed/Effects/blood.rsi
      state: uniformbloodicon
  # Ganimed-Port-End
  #ADT-Tweak-Start
  - type: CoveredSlot
    slots: [underwearb, underweart]
  #ADT-Tweak-End

- type: entity
  abstract: true
  parent: UnsensoredClothingUniformBase
  id: UnsensoredClothingUniformSkirtBase
  components:
  - type: Clothing
    slots: [innerclothing]
    femaleMask: UniformTop
  # Ganimed-Port: стайны (funky-station/forky-station#107)
  - type: Stainable
    clothingVisuals:
      jumpsuit:
      - sprite: _Ganimed/Effects/blood.rsi
        state: uniformblood
    iconVisuals:
    - sprite: _Ganimed/Effects/blood.rsi
      state: uniformbloodicon
  #ADT-Tweak-Start
  - type: CoveredSlot # Backmen
    slots: [underweart]
  #ADT-Tweak-End


- type: entity
  abstract: true
  parent: UnsensoredClothingUniformBase
  id: ClothingUniformBase
  components:
  - type: SuitSensor
  - type: DeviceNetwork
    deviceNetId: Wireless
    transmitFrequencyId: SuitSensor
    savableAddress: false
  - type: WirelessNetworkConnection
    range: 1200
  - type: StationLimitedNetwork
  #ADT-Tweak-Start
  - type: CoveredSlot
    slots: [underwearb, underweart]
  - type: Tag
    tags:
      - ADTJumpSuitSacrifice
      - WhitelistChameleon
  - type: HidesSlots
    hidesSlots: [ UNDERWEART, UNDERWEARB, POCKET ]
  #ADT-Tweak-End

- type: entity
  abstract: true
  parent: ClothingUniformBase
  id: ClothingUniformSkirtBase
  components:
  - type: Clothing
    slots: [innerclothing]
    femaleMask: UniformTop
  # Ganimed-Port: стайны (funky-station/forky-station#107)
  - type: Stainable
    clothingVisuals:
      jumpsuit:
      - sprite: _Ganimed/Effects/blood.rsi
        state: uniformblood
    iconVisuals:
    - sprite: _Ganimed/Effects/blood.rsi
      state: uniformbloodicon
  #ADT-Tweak-Start
  - type: CoveredSlot
    slots: [underweart]
  #ADT-Tweak-End

- type: entity
  abstract: true
  id: ClothingUniformFoldableBase
  components:
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: unfold-verb-clothing-jacket
    foldVerbText: fold-verb-clothing-jacket
  - type: FoldableClothing
    foldedEquippedPrefix: folded
