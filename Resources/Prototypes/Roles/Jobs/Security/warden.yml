- type: job
  id: Warden
  name: job-name-warden
  description: job-description-warden
  playTimeTracker: JobWarden
  requirements:
    - !type:RoleTimeRequirement
      role: JobSecurityOfficer
      time: 36000 #10 hrs
    - !type:DepartmentTimeRequirement
      department: Security
      time: 25h #  Ganimed-RoleTime
    # ADT-Tweak start
    - !type:TraitsRequirement
      inverted: true
      traits:
      - Muted
    # ADT-Tweak end
    - !type:SpeciesRequirement
      inverted: true
      species:
      - Resomi
      - Vox
#      - Shadekin
  # ADT RESTRICT End
    - !type:AgeRequirement # Ganimed-MRP
      requiredAge: 21
  startingGear: WardenGear
  icon: "JobIconWarden"
  supervisors: job-supervisors-hos
  canBeAntag: false
  access:
  - Security
  - Brig
  - Armory
  - Maintenance
  - External
  - Detective
  - Cryogenics
  - GenpopEnter
  - GenpopLeave
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial # goobstation
    components:
      - type: SecurityStaff

