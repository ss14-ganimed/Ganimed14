- type: entity
  id: ControlReturnAction
  name: Stop controlling turret
  components:
  - type: Action
    icon:
      sprite: ADT/Interface/Actions/actions_turret.rsi
      state: stop_control
    useDelay: 1
  - type: InstantAction
    event: !type:ControlReturnActionEvent {}

- type: entity
  id: ActionTurretShowRadar
  name: Mass Scanner Interface
  description: View a Mass Scanner Interface.
  components:
  - type: Action
    # Ganimed-Edit: mass-scanner icon instead of the placeholder crowbar sprite
    icon:
      sprite: Interface/Actions/actions_ai.rsi
      state: mass_scanner
    useDelay: 1
    checkCanInteract: false
  - type: InstantAction
    event: !type:ToggleIntrinsicUIEvent { key: enum.RadarConsoleUiKey.Key }
