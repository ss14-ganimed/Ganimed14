- type: reagent
  id: ADTCopperNitride
  name: reagent-name-copper-nitride
  desc: reagent-desc-copper-nitride
  physicalDesc: reagent-physical-desc-crystalline
  color: "#09590a"
  pH: 7.0
  boilingPoint: 300
  meltingPoint: 300

- type: reagent
  id: ADTMethylamine
  name: reagent-name-methylamine
  desc: reagent-desc-methylamine
  flavor: bitter
  color: "#c5c5c5"
  pH: 11.0
  physicalDesc: reagent-physical-desc-opaque
  plantMetabolism:
  - !type:PlantAdjustToxins
    amount: 10
  - !type:PlantAdjustHealth
    amount: -5
  metabolisms:
    Poison:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 2

- type: reagent
  id: ADTMethanol
  name: reagent-name-methanol
  desc: reagent-desc-methanol
  flavor: bitter
  color: "#7cff70"
  pH: 7.0
  physicalDesc: reagent-physical-desc-strong-smelling
  plantMetabolism:
  - !type:PlantAdjustToxins
    amount: 20
  - !type:PlantAdjustHealth
    amount: -10
  metabolisms:
    Poison:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 3.5
      - !type:GenericStatusEffect
        key: TemporaryBlindness
        component: TemporaryBlindness
        conditions:
        - !type:ReagentCondition
          reagent: ADTMethanol
          min: 7
      - !type:PopupMessage
        visualType: MediumCaution
        type: Local
        messages:
        - norepinephricacid-effect-eye-disconnect
        - norepinephricacid-effect-eye-pain
        - norepinephricacid-effect-darkness
        - norepinephricacid-effect-blindness
        conditions:
        - !type:ReagentCondition
          reagent: ADTMethanol
          min: 7

- type: reagent
  id: ADTPlutoniumReactant
  name: reagent-name-plutonium
  desc: reagent-desc-plutonium
  physicalDesc: reagent-physical-desc-metallic
  color: "#09590a"
  pH: 6.5
  boilingPoint: 1500
  meltingPoint: 2500

- type: reagent
  id: ADTThermolyne
  name: reagent-name-thermolyne
  group: Medicine
  desc: reagent-desc-thermolyne
  physicalDesc: reagent-physical-desc-burning
  flavor: peppery
  color: "#ff5f00"
  pH: 6.5
  metabolisms:
    Medicine:
      effects:
      - !type:HealthChange
        damage:
          types:
            Cold: -10
            Heat: -5
      - !type:AdjustTemperature
        conditions:
        - !type:TemperatureCondition
          max: 100
        amount: 20000 # thermal energy, not temperature!
      - !type:AdjustTemperature
        conditions:
        - !type:TemperatureCondition
          min: 1
        amount: 20000
      - !type:PopupMessage
        type: Local
        visualType: Medium
        messages: [ "leporazine-effect-temperature-adjusting" ]
        probability: 0.2